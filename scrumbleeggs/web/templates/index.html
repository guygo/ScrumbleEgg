<!DOCTYPE html>
<html lang="en" x-data="app()" x-init="init()">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrumbleeggs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

  <script>
    tailwind.config = {
      theme: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        extend: {
          colors: {
            /* Linear-style neutrals */
            n950: '#0a0a0c',
            n900: '#111113',
            n850: '#161618',
            n800: '#1c1c1f',
            n750: '#212124',
            n700: '#2a2a2e',
            n600: '#3a3a3f',
            n500: '#515158',
            n400: '#6e6e76',
            n300: '#94949d',
            n200: '#b8b8c0',
            n100: '#dcdce0',
            n50:  '#f0f0f2',
            /* Accent */
            acc:  '#5e6ad2',
            accH: '#6b78e5',
            /* Semantic */
            pri_red:    '#eb5757',
            pri_orange: '#e8945a',
            pri_yellow: '#d4a843',
            pri_gray:   '#515158',
          }
        }
      }
    }
  </script>

  <style>
    [x-cloak] { display: none !important; }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { background: #0f0f11; color: #e2e2e5; font-family: 'Inter', sans-serif; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a2e; border-radius: 9px; }

    /* Drag states */
    .dragging   { opacity: 0.25; }
    .drop-over  { outline: 1.5px dashed #5e6ad2; background: rgba(94,106,210,0.05) !important; }

    /* Card hover reveal */
    .card-actions { opacity: 0; transition: opacity 0.1s; }
    .ticket-card:hover .card-actions { opacity: 1; }

    /* Subtle card entrance */
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(4px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .card-in { animation: fadeUp 0.12s ease-out; }

    /* Toast */
    @keyframes toastIn  { from { opacity:0; transform:translateY(8px) scale(0.97); } to { opacity:1; transform:none; } }
    @keyframes toastOut { to   { opacity:0; transform:translateY(4px); } }

    /* Sidebar panel */
    .detail-panel { transition: transform 0.2s cubic-bezier(0.16,1,0.3,1); }

    /* Field label */
    .field-label { font-size: 11px; font-weight: 500; color: #6e6e76; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }

    kbd {
      font-family: inherit;
      font-size: 10px;
      background: #2a2a2e;
      border: 1px solid #3a3a3f;
      border-radius: 4px;
      padding: 1px 5px;
      color: #6e6e76;
    }

    /* Linear-style select */
    select { -webkit-appearance: none; appearance: none; }

    /* Checkbox */
    input[type=checkbox] { accent-color: #5e6ad2; }
  </style>
</head>

<body class="h-screen flex flex-col overflow-hidden" @keydown.window="handleKey($event)">

<!-- ═══════════  SIDEBAR (detail panel)  ═══════════ -->
<div x-show="detailOpen" x-cloak class="fixed inset-0 z-50 flex justify-end" @keydown.escape.window="detailOpen=false">
  <div class="absolute inset-0 bg-black/40" @click="detailOpen=false"></div>
  <div class="detail-panel relative w-[520px] max-w-full h-full bg-n850 border-l border-n700
              flex flex-col overflow-hidden shadow-2xl z-10">

    <!-- Panel toolbar -->
    <div class="flex items-center justify-between px-5 py-3 border-b border-n700 flex-shrink-0">
      <div class="flex items-center gap-2">
        <span class="font-mono text-xs text-acc font-medium" x-text="currentTicket?.key"></span>
        <span class="text-n500 text-xs">·</span>
        <span class="text-xs text-n300 capitalize" x-text="currentTicket?.status?.replace('_',' ')"></span>
      </div>
      <div class="flex items-center gap-1">
        <button @click="openEdit(currentTicket)"
                class="px-2.5 py-1 text-xs text-n300 hover:text-n100 hover:bg-n700 rounded-md transition-colors">
          Edit
        </button>
        <button @click="deleteTicket(currentTicket.key)"
                class="px-2.5 py-1 text-xs text-n300 hover:text-pri_red hover:bg-pri_red/10 rounded-md transition-colors">
          Delete
        </button>
        <div class="w-px h-4 bg-n700 mx-1"></div>
        <button @click="detailOpen=false" class="p-1.5 text-n400 hover:text-n100 hover:bg-n700 rounded-md transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Panel body -->
    <div class="flex-1 overflow-y-auto" x-show="currentTicket">
      <div class="px-6 py-5 space-y-5">

        <!-- Title -->
        <div>
          <h2 class="text-[17px] font-semibold text-n50 leading-snug" x-text="currentTicket?.title"></h2>
        </div>

        <!-- Properties grid -->
        <div class="grid grid-cols-2 gap-1 text-sm">

          <!-- Status -->
          <div class="col-span-2 flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-n750 group cursor-pointer transition-colors">
            <span class="field-label w-24 flex-shrink-0">Status</span>
            <select :value="currentTicket?.status"
                    @change="moveTicket(currentTicket.key, $event.target.value)"
                    class="bg-transparent text-n100 text-sm font-medium focus:outline-none cursor-pointer flex-1">
              <option value="backlog">Backlog</option>
              <option value="in_progress">In Progress</option>
              <option value="review">Review</option>
              <option value="done">Done</option>
            </select>
          </div>

          <!-- Priority -->
          <div class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-n750 transition-colors">
            <span class="field-label w-24 flex-shrink-0">Priority</span>
            <div class="flex items-center gap-1.5">
              <span x-html="priorityIcon(currentTicket?.priority)"></span>
              <span class="text-sm text-n200 capitalize" x-text="currentTicket?.priority"></span>
            </div>
          </div>

          <!-- Assignee -->
          <div class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-n750 transition-colors">
            <span class="field-label w-24 flex-shrink-0">Assignee</span>
            <div class="flex items-center gap-1.5">
              <span x-show="currentTicket?.assignee" x-html="avatar(currentTicket?.assignee)"></span>
              <span class="text-sm text-n200" x-text="currentTicket?.assignee || '—'"></span>
            </div>
          </div>

          <!-- Type -->
          <div class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-n750 transition-colors">
            <span class="field-label w-24 flex-shrink-0">Type</span>
            <div class="flex items-center gap-1.5">
              <span x-html="typeIcon(currentTicket?.ticket_type)"></span>
              <span class="text-sm text-n200 capitalize" x-text="currentTicket?.ticket_type"></span>
            </div>
          </div>

          <!-- Story Points -->
          <div class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-n750 transition-colors">
            <span class="field-label w-24 flex-shrink-0">Points</span>
            <span class="text-sm text-n200 font-mono" x-text="currentTicket?.story_points ?? '—'"></span>
          </div>

          <!-- Sprint -->
          <div class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-n750 transition-colors">
            <span class="field-label w-24 flex-shrink-0">Sprint</span>
            <span class="text-sm text-n200" x-text="currentTicket?.sprint || '—'"></span>
          </div>

          <!-- Role -->
          <div class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-n750 transition-colors" x-show="currentTicket?.role">
            <span class="field-label w-24 flex-shrink-0">Role</span>
            <span class="text-sm text-n200 capitalize" x-text="currentTicket?.role"></span>
          </div>

          <!-- Created -->
          <div class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-n750 transition-colors">
            <span class="field-label w-24 flex-shrink-0">Created</span>
            <span class="text-sm text-n400" x-text="relativeDate(currentTicket?.created_at)"></span>
          </div>
        </div>

        <!-- Divider -->
        <div class="border-t border-n700"></div>

        <!-- Description -->
        <div x-show="currentTicket?.description">
          <p class="field-label mb-2">Description</p>
          <p class="text-[13px] text-n200 leading-relaxed whitespace-pre-wrap" x-text="currentTicket?.description"></p>
        </div>

        <!-- Acceptance Criteria -->
        <div x-show="currentTicket?.acceptance_criteria">
          <p class="field-label mb-2">Acceptance Criteria</p>
          <div class="text-[13px] text-n200 leading-relaxed whitespace-pre-wrap bg-n800 rounded-lg p-3 border-l-2 border-acc"
               x-text="currentTicket?.acceptance_criteria"></div>
        </div>

        <!-- Dev Checklist -->
        <div x-show="currentTicket?.dev_checklist?.length">
          <p class="field-label mb-2">Dev Checklist</p>
          <div class="space-y-1">
            <template x-for="item in (currentTicket?.dev_checklist||[])" :key="item.item||item">
              <div class="flex items-center gap-2.5 py-1.5">
                <div :class="(item.done||item===true) ? 'bg-acc border-acc' : 'border-n600'"
                     class="w-3.5 h-3.5 rounded border flex items-center justify-center flex-shrink-0">
                  <svg x-show="item.done" class="w-2 h-2 text-white" fill="currentColor" viewBox="0 0 12 12">
                    <path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                  </svg>
                </div>
                <span :class="item.done ? 'line-through text-n500' : 'text-n200'"
                      class="text-[13px]" x-text="item.item || item"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Test Plan -->
        <div x-show="currentTicket?.test_plan">
          <p class="field-label mb-2">Test Plan</p>
          <div class="text-[13px] text-n200 leading-relaxed whitespace-pre-wrap bg-n800 rounded-lg p-3 border-l-2 border-pri_yellow"
               x-text="currentTicket?.test_plan"></div>
        </div>

        <!-- Test Cases -->
        <div x-show="currentTicket?.test_cases?.length">
          <p class="field-label mb-2">Test Cases</p>
          <div class="space-y-2">
            <template x-for="tc in (currentTicket?.test_cases||[])" :key="tc.name||tc">
              <div class="bg-n800 rounded-lg p-3 border border-n700">
                <div class="flex items-center justify-between mb-1.5" x-show="tc.name">
                  <span class="text-[13px] font-medium text-n100" x-text="tc.name"></span>
                  <span class="text-[10px] px-1.5 py-px rounded font-medium uppercase tracking-wide"
                        :class="tc.status==='pass' ? 'bg-green-500/15 text-green-400' : tc.status==='fail' ? 'bg-pri_red/15 text-pri_red' : 'bg-n700 text-n400'"
                        x-text="tc.status||'pending'"></span>
                </div>
                <p x-show="tc.steps" class="text-[12px] text-n400 mb-0.5"><span class="text-n500">Steps: </span><span x-text="tc.steps"></span></p>
                <p x-show="tc.expected" class="text-[12px] text-n400"><span class="text-n500">Expected: </span><span x-text="tc.expected"></span></p>
                <p x-show="typeof tc==='string'" class="text-[13px] text-n200" x-text="tc"></p>
              </div>
            </template>
          </div>
        </div>

        <!-- QA Notes -->
        <div x-show="currentTicket?.qa_notes">
          <p class="field-label mb-2">QA Notes</p>
          <div class="text-[13px] text-n200 leading-relaxed whitespace-pre-wrap bg-n800 rounded-lg p-3 border-l-2 border-pri_orange"
               x-text="currentTicket?.qa_notes"></div>
        </div>

        <!-- Bottom padding -->
        <div class="h-4"></div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════  CREATE / EDIT MODAL  ═══════════ -->
<div x-show="formOpen" x-cloak
     class="fixed inset-0 z-50 flex items-start justify-center pt-[10vh]"
     @keydown.escape.window="formOpen=false">
  <div class="absolute inset-0 bg-black/60" @click="formOpen=false"></div>

  <div class="relative bg-n850 border border-n700 rounded-xl shadow-2xl w-full max-w-[540px] max-h-[82vh]
              overflow-y-auto z-10">
    <div class="p-5">

      <!-- Modal header -->
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold text-n100" x-text="editKey ? 'Edit issue' : 'New issue'"></h2>
        <button @click="formOpen=false" class="p-1.5 text-n500 hover:text-n200 hover:bg-n700 rounded-md transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="space-y-3">

        <!-- Title -->
        <input type="text" x-model="form.title" x-ref="titleInput"
               placeholder="Issue title"
               class="w-full bg-transparent text-n50 text-base font-medium placeholder-n600
                      border-none focus:outline-none py-1" />

        <!-- Description -->
        <textarea x-model="form.description" rows="2"
                  placeholder="Add description…"
                  class="w-full bg-transparent text-n300 text-sm placeholder-n600
                         border-none focus:outline-none resize-none"></textarea>

        <div class="border-t border-n700 pt-3"></div>

        <!-- Properties row -->
        <div class="flex flex-wrap gap-2">

          <!-- Priority -->
          <div class="relative">
            <label class="field-label block mb-1">Priority</label>
            <div class="flex gap-1">
              <template x-for="p in ['critical','high','medium','low']" :key="p">
                <button @click="form.priority=p"
                        :class="form.priority===p ? 'bg-n700 ring-1 ring-n500' : 'hover:bg-n750'"
                        class="flex items-center gap-1.5 px-2 py-1 rounded text-xs text-n300 transition-colors">
                  <span x-html="priorityIcon(p)"></span>
                  <span class="capitalize" x-text="p"></span>
                </button>
              </template>
            </div>
          </div>

        </div>

        <!-- Second row -->
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="field-label block">Type</label>
            <select x-model="form.ticket_type"
                    class="w-full bg-n800 border border-n700 text-n200 rounded-lg px-2.5 py-1.5
                           text-xs focus:outline-none focus:border-n500 mt-1">
              <option value="task">Task</option>
              <option value="story">Story</option>
              <option value="bug">Bug</option>
            </select>
          </div>
          <div>
            <label class="field-label block">Assignee</label>
            <input type="text" x-model="form.assignee" placeholder="Name"
                   class="w-full bg-n800 border border-n700 text-n200 rounded-lg px-2.5 py-1.5
                          text-xs focus:outline-none focus:border-n500 placeholder-n600 mt-1"/>
          </div>
          <div>
            <label class="field-label block">Sprint</label>
            <input type="text" x-model="form.sprint" placeholder="Sprint 1"
                   class="w-full bg-n800 border border-n700 text-n200 rounded-lg px-2.5 py-1.5
                          text-xs focus:outline-none focus:border-n500 placeholder-n600 mt-1"/>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="field-label block">Points</label>
            <input type="number" x-model.number="form.story_points" placeholder="—" min="0"
                   class="w-full bg-n800 border border-n700 text-n200 rounded-lg px-2.5 py-1.5
                          text-xs focus:outline-none focus:border-n500 placeholder-n600 mt-1"/>
          </div>
          <div>
            <label class="field-label block">Role</label>
            <select x-model="form.role"
                    class="w-full bg-n800 border border-n700 text-n200 rounded-lg px-2.5 py-1.5
                           text-xs focus:outline-none focus:border-n500 mt-1">
              <option value="">None</option>
              <option value="developer">Developer</option>
              <option value="tester">Tester</option>
            </select>
          </div>
        </div>

        <!-- Dev fields -->
        <div x-show="form.role==='developer'" class="space-y-2 pt-1 border-t border-n700">
          <p class="field-label text-acc">Dev Fields</p>
          <div>
            <label class="field-label block">Acceptance Criteria</label>
            <textarea x-model="form.acceptance_criteria" rows="3"
                      placeholder="Given… When… Then…"
                      class="w-full bg-n800 border border-n700 text-n200 rounded-lg px-2.5 py-1.5
                             text-xs focus:outline-none focus:border-n500 placeholder-n600 resize-none mt-1"></textarea>
          </div>
        </div>

        <!-- Tester fields -->
        <div x-show="form.role==='tester'" class="space-y-2 pt-1 border-t border-n700">
          <p class="field-label text-pri_yellow">QA Fields</p>
          <div>
            <label class="field-label block">Test Plan</label>
            <textarea x-model="form.test_plan" rows="3"
                      placeholder="Scope, approach, risks…"
                      class="w-full bg-n800 border border-n700 text-n200 rounded-lg px-2.5 py-1.5
                             text-xs focus:outline-none focus:border-n500 placeholder-n600 resize-none mt-1"></textarea>
          </div>
          <div>
            <label class="field-label block">QA Notes</label>
            <textarea x-model="form.qa_notes" rows="2"
                      placeholder="Edge cases, blockers…"
                      class="w-full bg-n800 border border-n700 text-n200 rounded-lg px-2.5 py-1.5
                             text-xs focus:outline-none focus:border-n500 placeholder-n600 resize-none mt-1"></textarea>
          </div>
        </div>

        <!-- Error -->
        <p x-show="formError" class="text-xs text-pri_red bg-pri_red/10 rounded-lg px-3 py-2" x-text="formError"></p>

        <!-- Actions -->
        <div class="flex items-center justify-between pt-2 border-t border-n700">
          <span class="text-xs text-n500"><kbd>Esc</kbd> to cancel</span>
          <div class="flex gap-2">
            <button @click="formOpen=false"
                    class="px-3.5 py-1.5 text-xs text-n300 hover:text-n100 hover:bg-n700 rounded-lg transition-colors">
              Cancel
            </button>
            <button @click="submitForm()"
                    :disabled="formLoading"
                    class="px-3.5 py-1.5 text-xs text-white bg-acc hover:bg-accH rounded-lg
                           font-medium transition-colors disabled:opacity-50">
              <span x-show="!formLoading" x-text="editKey ? 'Save changes' : 'Create issue'"></span>
              <span x-show="formLoading">Saving…</span>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- ═══════════  TOAST STACK  ═══════════ -->
<div class="fixed bottom-5 right-5 z-[60] flex flex-col gap-1.5 pointer-events-none">
  <template x-for="t in toasts" :key="t.id">
    <div class="pointer-events-auto flex items-center gap-2.5 px-3.5 py-2 rounded-lg shadow-xl text-xs font-medium
                border backdrop-blur-sm"
         :class="t.type==='success'
           ? 'bg-n800/90 border-n700 text-n100'
           : 'bg-pri_red/10 border-pri_red/30 text-pri_red'"
         style="animation: toastIn 0.2s ease-out forwards">
      <span x-show="t.type==='success'" class="text-green-400">✓</span>
      <span x-show="t.type==='error'" class="text-pri_red">✕</span>
      <span x-text="t.message"></span>
    </div>
  </template>
</div>

<!-- ═══════════  TOP BAR  ═══════════ -->
<header class="flex-shrink-0 h-11 bg-n900 border-b border-n800
               flex items-center px-4 gap-3">

  <!-- Brand -->
  <div class="flex items-center gap-2 min-w-[160px]">
    <svg class="w-5 h-5 text-acc" viewBox="0 0 24 24" fill="currentColor">
      <ellipse cx="12" cy="12" rx="8" ry="10" opacity="0.15"/>
      <ellipse cx="12" cy="12" rx="8" ry="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M8 10c.5-2 3.5-3 5-1.5M9 14c.5 2 3.5 2.5 5 1" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </svg>
    <span class="text-sm font-semibold text-n100 tracking-tight">Scrumbleeggs</span>
  </div>

  <!-- Search / JQL -->
  <div class="flex-1 max-w-xl">
    <div class="flex items-center gap-2 bg-n800 border border-n700 hover:border-n600
                focus-within:border-n500 rounded-lg px-3 py-1.5 transition-colors">
      <svg class="w-3.5 h-3.5 text-n500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
      </svg>
      <input type="text"
             x-model="jqlRaw"
             @input.debounce.250ms="applyJQL()"
             @keydown.enter="applyJQL()"
             @keydown.escape="clearJQL()"
             @focus="showHint=true"
             @blur="showHint=false"
             placeholder="Filter: priority:high assignee:alice type:bug…"
             class="flex-1 bg-transparent text-xs text-n100 placeholder-n500 focus:outline-none min-w-0" />
      <button x-show="jqlRaw" @click="clearJQL()"
              class="text-n500 hover:text-n200 transition-colors flex-shrink-0">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Spacer -->
  <div class="flex-1"></div>

  <!-- Stats -->
  <div class="hidden lg:flex items-center gap-4 text-xs text-n400">
    <div class="flex items-center gap-1.5">
      <div class="w-1.5 h-1.5 rounded-full bg-n500"></div>
      <span x-text="stats.backlog ?? 0"></span>
      <span>backlog</span>
    </div>
    <div class="flex items-center gap-1.5">
      <div class="w-1.5 h-1.5 rounded-full bg-acc"></div>
      <span x-text="stats.in_progress ?? 0"></span>
      <span>in progress</span>
    </div>
    <div class="flex items-center gap-1.5">
      <div class="w-1.5 h-1.5 rounded-full" style="background:#4ade80"></div>
      <span x-text="stats.done ?? 0"></span>
      <span>done</span>
    </div>
    <div class="w-px h-4 bg-n700"></div>
    <div class="flex items-center gap-1.5">
      <div class="w-16 bg-n700 rounded-full h-1 overflow-hidden">

<!-- ═══════════  ALPINE APP  ═══════════ -->
<script>
function app() {
  return {
    view: 'board',
    board: {},
    listTickets: [], listTotal: 0, listPage: 1, listPageSize: 50,
    stats: {},
    currentTicket: null, detailOpen: false,
    formOpen: false, formLoading: false, formError: '', editKey: null,
    draggedTicket: null,
    jqlRaw: '', parsedJQL: {}, showHint: false,
    toasts: [],

    columns: [
      { status:'backlog',     label:'Backlog',     icon: svgStatusIcon('backlog') },
      { status:'in_progress', label:'In Progress', icon: svgStatusIcon('in_progress') },
      { status:'review',      label:'Review',      icon: svgStatusIcon('review') },
      { status:'done',        label:'Done',        icon: svgStatusIcon('done') },
    ],

    form: {
      title:'', ticket_type:'task', priority:'medium', assignee:'', sprint:'',
      story_points:null, role:'', description:'', acceptance_criteria:'',
      dev_checklist:[], qa_notes:'', test_cases:[], test_plan:''
    },

    // ── Computed ──────────────────────────────────────────────────

    get filteredBoard() {
      const out = {};
      for (const [status, tickets] of Object.entries(this.board)) {
        out[status] = tickets.filter(t => this.matchJQL(t));
      }
      return out;
    },

    get activeChips() {
      return Object.entries(this.parsedJQL)
        .filter(([k]) => k !== 'title')
        .map(([k,v]) => ({ key:k, val:v }));
    },

    // ── Init ─────────────────────────────────────────────────────

    async init() {
      await Promise.all([this.loadBoard(), this.loadStats()]);
    },

    // ── Data ─────────────────────────────────────────────────────

    async loadBoard() {
      const p = new URLSearchParams();
      if (this.parsedJQL.sprint) p.set('sprint', this.parsedJQL.sprint);
      const res = await fetch('/api/board?' + p);
      this.board = await res.json();
    },

    async loadList() {
      const p = new URLSearchParams({ page: this.listPage, page_size: this.listPageSize });
      if (this.parsedJQL.sprint)   p.set('sprint',      this.parsedJQL.sprint);
      if (this.parsedJQL.assignee) p.set('assignee',    this.parsedJQL.assignee);
      if (this.parsedJQL.priority) p.set('priority',    this.parsedJQL.priority);
      if (this.parsedJQL.role)     p.set('role',        this.parsedJQL.role);
      if (this.parsedJQL.type)     p.set('ticket_type', this.parsedJQL.type);
      if (this.parsedJQL.status)   p.set('status',      this.parsedJQL.status);
      const res = await fetch('/api/tickets?' + p);
      const data = await res.json();
      this.listTickets = data.tickets.filter(t => this.matchJQL(t));
      this.listTotal = data.total;
    },

    async loadStats() {
      this.stats = await (await fetch('/api/stats')).json();
    },

    // ── JQL ──────────────────────────────────────────────────────

    parseJQL(raw) {
      const out = {};
      const re = /(\w+):(?:"([^"]+)"|(\S+))|(\S+)/g;
      let titleParts = [], m;
      while ((m = re.exec(raw)) !== null) {
        if (m[1]) {
          const key = m[1].toLowerCase(), val = (m[2]||m[3]).toLowerCase();
          if (key==='priority'||key==='pri') out.priority = val;
          else if (key==='assignee'||key==='a') out.assignee = val;
          else if (key==='role'||key==='r')     out.role = val;
          else if (key==='sprint'||key==='s')   out.sprint = m[2]||m[3];
          else if (key==='type')                out.type = val;
          else if (key==='status')              out.status = val;
          else if (key==='pts'||key==='points') out.points = val;
          else out[key] = val;
        } else if (m[4]) {
          titleParts.push(m[4].toLowerCase());
        }
      }
      if (titleParts.length) out.title = titleParts.join(' ');
      return out;
    },

    matchJQL(ticket) {
      const jql = this.parsedJQL;
      if (jql.title) {
        const hay = ((ticket.title||'') + ' ' + (ticket.description||'')).toLowerCase();
        if (!hay.includes(jql.title)) return false;
      }
      if (jql.priority && ticket.priority !== jql.priority) return false;
      if (jql.type     && ticket.ticket_type !== jql.type)  return false;
      if (jql.status   && ticket.status !== jql.status)     return false;
      if (jql.role) {
        if (!ticket.role || !ticket.role.toLowerCase().startsWith(jql.role)) return false;
      }
      if (jql.assignee) {
        if (!ticket.assignee || !ticket.assignee.toLowerCase().includes(jql.assignee)) return false;
      }
      if (jql.sprint) {
        if (!ticket.sprint || !ticket.sprint.toLowerCase().includes(jql.sprint.toLowerCase())) return false;
      }
      if (jql.points) {
        const pts = ticket.story_points, v = jql.points;
        if (v.startsWith('>='))      { if (!(pts >= +v.slice(2))) return false; }
        else if (v.startsWith('>'))  { if (!(pts >  +v.slice(1))) return false; }
        else if (v.startsWith('<=')) { if (!(pts <= +v.slice(2))) return false; }
        else if (v.startsWith('<'))  { if (!(pts <  +v.slice(1))) return false; }
        else                         { if (pts !== +v) return false; }
      }
      return true;
    },

    async applyJQL() {
      this.parsedJQL = this.parseJQL(this.jqlRaw);
      this.listPage = 1;
      if (this.view==='board') await this.loadBoard();
      else await this.loadList();
    },

    clearJQL() {
      this.jqlRaw = ''; this.parsedJQL = {}; this.listPage = 1;
      if (this.view==='board') this.loadBoard(); else this.loadList();
    },

    removeChip(key) {
      delete this.parsedJQL[key];
      this.jqlRaw = this.jqlToString(this.parsedJQL);
      this.listPage = 1;
      if (this.view==='board') this.loadBoard(); else this.loadList();
    },

    jqlToString(p) {
      const parts = [];
      if (p.title)    parts.push(p.title);
      if (p.priority) parts.push(`priority:${p.priority}`);
      if (p.role)     parts.push(`role:${p.role}`);
      if (p.assignee) parts.push(`assignee:${p.assignee}`);
      if (p.sprint)   parts.push(p.sprint.includes(' ') ? `sprint:"${p.sprint}"` : `sprint:${p.sprint}`);
      if (p.type)     parts.push(`type:${p.type}`);
      if (p.status)   parts.push(`status:${p.status}`);
      if (p.points)   parts.push(`pts:${p.points}`);
      return parts.join(' ');
    },

    // ── View ─────────────────────────────────────────────────────

    async switchView(v) {
      this.view = v;
      if (v==='list') await this.loadList(); else await this.loadBoard();
    },

    // ── Detail ───────────────────────────────────────────────────

    async openDetail(ticket) {
      this.currentTicket = await (await fetch(`/api/tickets/${ticket.key}`)).json();
      this.detailOpen = true;
    },

    async moveTicket(key, status) {
      const res = await fetch(`/api/tickets/${key}/move`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ status })
      });
      if (res.ok) {
        this.currentTicket = await res.json();
        await Promise.all([this.loadBoard(), this.loadStats()]);
        if (this.view==='list') await this.loadList();
        this.showToast('Moved to ' + status.replace('_',' '), 'success');
      } else {
        this.showToast('Move failed', 'error');
      }
    },

    async deleteTicket(key) {
      if (!confirm(`Delete ${key}?`)) return;
      const res = await fetch(`/api/tickets/${key}`, { method:'DELETE' });
      if (res.ok || res.status===204) {
        this.detailOpen = false;
        await Promise.all([this.loadBoard(), this.loadStats()]);
        if (this.view==='list') await this.loadList();
        this.showToast(`${key} deleted`, 'success');
      }
    },

    // ── Create / Edit ────────────────────────────────────────────

    openCreate() { this._openForm(null, {}); },

    openCreateInCol(status) {
      this._openForm(null, {});
      // hint at status after form opens (form doesn't have a status field yet)
    },

    openEdit(ticket) { this._openForm(ticket.key, ticket); },

    _openForm(key, ticket) {
      this.editKey = key;
      this.formError = '';
      this.form = {
        title:               ticket.title || '',
        ticket_type:         ticket.ticket_type || 'task',
        priority:            ticket.priority || 'medium',
        assignee:            ticket.assignee || '',
        sprint:              ticket.sprint || '',
        story_points:        ticket.story_points || null,
        role:                ticket.role || '',
        description:         ticket.description || '',
        acceptance_criteria: ticket.acceptance_criteria || '',
        dev_checklist:       ticket.dev_checklist || [],
        qa_notes:            ticket.qa_notes || '',
        test_cases:          ticket.test_cases || [],
        test_plan:           ticket.test_plan || '',
      };
      this.detailOpen = false;
      this.formOpen = true;
      this.$nextTick(() => this.$refs.titleInput?.focus());
    },

    async submitForm() {
      if (!this.form.title.trim()) { this.formError = 'Title is required.'; return; }
      this.formLoading = true; this.formError = '';
      const body = { ...this.form };
      if (!body.story_points) body.story_points = null;
      if (!body.role) body.role = null;

      try {
        const url  = this.editKey ? `/api/tickets/${this.editKey}` : '/api/tickets';
        const meth = this.editKey ? 'PATCH' : 'POST';
        const res  = await fetch(url, { method:meth, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });

        if (res.ok || res.status===201) {
          const ticket = await res.json();
          this.formOpen = false;
          await Promise.all([this.loadBoard(), this.loadStats()]);
          if (this.view==='list') await this.loadList();
          this.showToast(this.editKey ? `${ticket.key} updated` : `${ticket.key} created`, 'success');
          if (this.editKey) { this.currentTicket = ticket; this.detailOpen = true; }
        } else {
          const err = await res.json().catch(()=>({}));
          this.formError = err.detail || 'Something went wrong.';
        }
      } finally { this.formLoading = false; }
    },

    // ── Drag & Drop ──────────────────────────────────────────────

    dragStart(event, ticket) {
      this.draggedTicket = ticket;
      event.currentTarget.classList.add('dragging');
      event.dataTransfer.effectAllowed = 'move';
    },

    dragEnd(event) { event.currentTarget.classList.remove('dragging'); },
    dragOver(event) { event.currentTarget.classList.add('drop-over'); },
    dragLeave(event) { event.currentTarget.classList.remove('drop-over'); },

    async dropTicket(event, status) {
      event.currentTarget.classList.remove('drop-over');
      if (!this.draggedTicket || this.draggedTicket.status === status) {
        this.draggedTicket = null; return;
      }
      const ticket = this.draggedTicket; this.draggedTicket = null;
      // Optimistic
      const nb = {};
      for (const [s, ts] of Object.entries(this.board)) nb[s] = ts.filter(t => t.key !== ticket.key);
      nb[status] = [{ ...ticket, status }, ...(nb[status]||[])];
      this.board = nb;
      await this.moveTicket(ticket.key, status);
    },

    // ── Keyboard ─────────────────────────────────────────────────

    handleKey(e) {
      if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      switch (e.key.toLowerCase()) {
        case 'n': this.openCreate(); break;
        case 'b': this.switchView('board'); break;
        case 'l': this.switchView('list'); break;
        case '/': e.preventDefault(); document.querySelector('.jql-input, input[placeholder*="Filter"]')?.focus(); break;
        case 'escape': this.formOpen=false; this.detailOpen=false; break;
      }
    },

    // ── Toast ────────────────────────────────────────────────────

    showToast(message, type='success') {
      const id = Date.now();
      this.toasts.push({ id, message, type });
      setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 3200);
    },

    // ── Icon helpers ─────────────────────────────────────────────

    priorityIcon(p) {
      const icons = {
        critical: `<svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <rect x="1" y="1" width="12" height="12" rx="2" fill="#eb5757" opacity="0.18"/>
          <rect x="1" y="1" width="12" height="12" rx="2" stroke="#eb5757" stroke-width="1.2"/>
          <path d="M7 4v3.5M7 9.5v.5" stroke="#eb5757" stroke-width="1.5" stroke-linecap="round"/>
        </svg>`,
        high: `<svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 2.5l4.5 7.5H2.5L7 2.5z" fill="#e8945a" opacity="0.18" stroke="#e8945a" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M7 5.5v2.5M7 9.3v.2" stroke="#e8945a" stroke-width="1.3" stroke-linecap="round"/>
        </svg>`,
        medium: `<svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="7" cy="7" r="5.5" stroke="#d4a843" stroke-width="1.2" fill="#d4a843" fill-opacity="0.15"/>
          <path d="M4.5 7h5M4.5 5h5M4.5 9h5" stroke="#d4a843" stroke-width="1.1" stroke-linecap="round"/>
        </svg>`,
        low: `<svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="7" cy="7" r="5.5" stroke="#515158" stroke-width="1.2" fill="#515158" fill-opacity="0.15"/>
          <path d="M5 6l2 2 2-2" stroke="#515158" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`,
      };
      return icons[p] || icons.medium;
    },

    typeIcon(type) {
      const icons = {
        bug: `<svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <circle cx="6.5" cy="6.5" r="5.5" fill="#eb5757" fill-opacity="0.15" stroke="#eb5757" stroke-width="1.1"/>
          <path d="M4.5 5.5c0-1.1.9-2 2-2s2 .9 2 2v2c0 1.1-.9 2-2 2s-2-.9-2-2v-2z" fill="#eb5757" opacity="0.5"/>
        </svg>`,
        story: `<svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <rect x="1" y="1" width="11" height="11" rx="2" fill="#5e6ad2" fill-opacity="0.15" stroke="#5e6ad2" stroke-width="1.1"/>
          <path d="M3.5 4.5h6M3.5 6.5h6M3.5 8.5h4" stroke="#5e6ad2" stroke-width="1.1" stroke-linecap="round"/>
        </svg>`,
        task: `<svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <rect x="1" y="1" width="11" height="11" rx="2" fill="none" stroke="#515158" stroke-width="1.1"/>
          <path d="M4 6.5l2 2 3.5-3.5" stroke="#515158" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`,
      };
      return icons[type] || icons.task;
    },

    statusIcon(status) {
      return svgStatusIcon(status);
    },

    avatar(name) {
      if (!name) return '';
      const initials = name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
      const colors = ['#5e6ad2','#e8945a','#d4a843','#4ade80','#eb5757','#a78bfa'];
      const idx = name.charCodeAt(0) % colors.length;
      const c = colors[idx];
      return `<span style="background:${c}22;color:${c};border:1px solid ${c}44"
        class="inline-flex items-center justify-center w-4 h-4 rounded-full text-[9px] font-semibold flex-shrink-0"
        title="${name}">${initials}</span>`;
    },

    relativeDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso), now = new Date();
      const diff = Math.floor((now - d) / 86400000);
      if (diff === 0) return 'today';
      if (diff === 1) return 'yesterday';
      if (diff <  7)  return `${diff}d ago`;
      if (diff < 30)  return `${Math.floor(diff/7)}w ago`;
      return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' });
    },
  }
}

// Status icons (used before Alpine init too)
function svgStatusIcon(status) {
  const icons = {
    backlog: `<svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <circle cx="7" cy="7" r="5.5" stroke="#515158" stroke-width="1.2" stroke-dasharray="2.5 1.5"/>
    </svg>`,
    in_progress: `<svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <circle cx="7" cy="7" r="5.5" stroke="#5e6ad2" stroke-width="1.2"/>
      <path d="M7 7V2a5 5 0 015 5H7z" fill="#5e6ad2"/>
    </svg>`,
    review: `<svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <circle cx="7" cy="7" r="5.5" stroke="#d4a843" stroke-width="1.2"/>
      <circle cx="7" cy="7" r="2.5" fill="#d4a843" fill-opacity="0.5" stroke="#d4a843" stroke-width="1"/>
    </svg>`,
    done: `<svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <circle cx="7" cy="7" r="5.5" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1.2"/>
      <path d="M4.5 7l2 2 3-3" stroke="#4ade80" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`,
  };
  return icons[status] || icons.backlog;
}
</script>
