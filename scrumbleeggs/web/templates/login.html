<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Scrumbleeggs</title>
  <!-- Preserve theme across page load -->
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('sbe_theme')||'dark')</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        fontFamily: { sans: ['Inter','system-ui','sans-serif'] },
        extend: {
          colors: {
            n950:'var(--n950)', n900:'var(--n900)', n800:'var(--n800)',
            n700:'var(--n700)', n600:'var(--n600)', n500:'var(--n500)',
            n400:'var(--n400)', n300:'var(--n300)', n200:'var(--n200)',
            n100:'var(--n100)',
            acc:'#5e6ad2', accH:'#6b78e5', accL:'rgba(94,106,210,0.12)',
          }
        }
      }
    }
  </script>
  <style>
    :root, [data-theme="dark"] {
      --n950:#09090b; --n900:#111113; --n800:#1c1c1f;
      --n700:#2a2a2e; --n600:#3a3a3f; --n500:#515158;
      --n400:#6e6e76; --n300:#94949d; --n200:#b8b8c0; --n100:#dcdce0;
      --bg:#0f0f11; --fg:#e2e2e5;
    }
    [data-theme="light"] {
      --n950:#f0f0f6; --n900:#ffffff; --n800:#f4f4f8;
      --n700:#e0e0e8; --n600:#c4c4d2; --n500:#7878a0;
      --n400:#545468; --n300:#383850; --n200:#222230; --n100:#141420;
      --bg:#f0f0f6; --fg:#141420;
    }
    body { background:var(--bg); color:var(--fg); }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 100px var(--n800) inset !important; -webkit-text-fill-color: var(--fg) !important; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-n900 border border-n700 flex items-center justify-center mb-4 shadow-lg">
        <svg class="w-7 h-7" viewBox="0 0 20 20" fill="none">
          <ellipse cx="10" cy="10" rx="7" ry="8.5" fill="#5e6ad2" opacity=".15"/>
          <ellipse cx="10" cy="10" rx="7" ry="8.5" stroke="#5e6ad2" stroke-width="1.4"/>
          <path d="M7 8.5c.4-1.5 2.8-2.2 4-1" stroke="#5e6ad2" stroke-width="1.1" fill="none" stroke-linecap="round"/>
          <path d="M7.5 12c.4 1.5 2.8 1.8 4 .5" stroke="#5e6ad2" stroke-width="1.1" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="text-xl font-semibold text-n100 tracking-tight">Scrumbleeggs</h1>
      <p class="text-sm text-n500 mt-1">Sign in to your workspace</p>
    </div>

    <!-- Card -->
    <div class="bg-n900 border border-n800 rounded-2xl p-6 shadow-2xl">

      <!-- Error message -->
      <div id="error-banner"
           class="hidden mb-4 px-3 py-2 rounded-lg bg-red-950 border border-red-800 text-red-300 text-sm">
        <span id="error-text"></span>
      </div>

      <form id="login-form" class="space-y-4" novalidate>

        <!-- Username -->
        <div>
          <label class="block text-xs font-medium text-n400 mb-1.5" for="username">
            Username
          </label>
          <input id="username" name="username" type="text"
                 autocomplete="username" autocapitalize="none" spellcheck="false"
                 required
                 class="w-full h-9 px-3 rounded-lg bg-n800 border border-n700
                        text-sm text-n100 placeholder-n600
                        focus:outline-none focus:border-acc focus:ring-1 focus:ring-acc/40
                        transition-colors" />
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-medium text-n400 mb-1.5" for="password">
            Password
          </label>
          <input id="password" name="password" type="password"
                 autocomplete="current-password"
                 required
                 class="w-full h-9 px-3 rounded-lg bg-n800 border border-n700
                        text-sm text-n100 placeholder-n600
                        focus:outline-none focus:border-acc focus:ring-1 focus:ring-acc/40
                        transition-colors" />
        </div>

        <!-- Submit -->
        <button id="submit-btn" type="submit"
                class="w-full h-9 rounded-lg bg-acc hover:bg-accH
                       text-white text-sm font-semibold transition-colors
                       disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          <span id="btn-label">Sign in</span>
          <svg id="btn-spinner" class="hidden animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="white" stroke-width="4"/>
            <path class="opacity-75" fill="white" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
        </button>

      </form>
    </div>

    <p class="text-center text-xs text-n600 mt-6">
      Contact your admin to create or reset an account.
    </p>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const btn = document.getElementById('submit-btn');
    const spinner = document.getElementById('btn-spinner');
    const btnLabel = document.getElementById('btn-label');
    const errorBanner = document.getElementById('error-banner');
    const errorText = document.getElementById('error-text');

    function showError(msg) {
      errorText.textContent = msg;
      errorBanner.classList.remove('hidden');
    }
    function hideError() {
      errorBanner.classList.add('hidden');
    }
    function setLoading(loading) {
      btn.disabled = loading;
      spinner.classList.toggle('hidden', !loading);
      btnLabel.textContent = loading ? 'Signing in…' : 'Sign in';
    }

    // Focus username on load
    document.getElementById('username').focus();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Please enter your username and password.');
        return;
      }

      setLoading(true);
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (res.ok) {
          const data = await res.json();
          window.location.href = data.redirect || '/';
        } else if (res.status === 429) {
          showError('Too many failed attempts. Please wait before trying again.');
        } else {
          showError('Invalid username or password.');
        }
      } catch {
        showError('Connection error. Please try again.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
