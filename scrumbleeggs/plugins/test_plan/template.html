<div x-data="{
  plans: [], activePlan: null, cases: [], loading: false,
  showNewPlan: false, showNewCase: false, caseFilter: 'all',
  newPlan: { name: '', description: '', sprint: '', status: 'draft' },
  newCase: { title: '', steps: '', expected: '', ticket_key: '' },

  get filteredCases() {
    if (this.caseFilter === 'all') return this.cases;
    return this.cases.filter(c => c.result === this.caseFilter);
  },
  get stats() {
    const total = this.cases.length;
    if (!total) return { total: 0, pass: 0, fail: 0, blocked: 0, pending: 0, pct: 0 };
    const pass    = this.cases.filter(c => c.result === 'pass').length;
    const fail    = this.cases.filter(c => c.result === 'fail').length;
    const blocked = this.cases.filter(c => c.result === 'blocked').length;
    return { total, pass, fail, blocked, pending: total - pass - fail - blocked,
             pct: Math.round(pass / total * 100) };
  },

  async init() {
    await this.loadPlans();
    // Re-load whenever the parent view switches back to this plugin
    window.addEventListener('sbe:plugin:test_plan', () => this.loadPlans());
  },
  async loadPlans() {
    this.loading = true;
    const r = await fetch('/api/plugins/test_plan/plans');
    this.plans = await r.json();
    this.loading = false;
    if (this.plans.length && !this.activePlan) await this.selectPlan(this.plans[0]);
  },
  async selectPlan(plan) {
    this.activePlan = plan;
    const r = await fetch('/api/plugins/test_plan/plans/' + plan.id + '/cases');
    this.cases = await r.json();
  },

  async createPlan() {
    if (!this.newPlan.name.trim()) return;
    const r = await fetch('/api/plugins/test_plan/plans', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(this.newPlan),
    });
    const plan = await r.json();
    this.plans.unshift(plan);
    this.newPlan = { name: '', description: '', sprint: '', status: 'draft' };
    this.showNewPlan = false;
    await this.selectPlan(plan);
  },
  async deletePlan(id) {
    if (!confirm('Delete this test plan and all its cases?')) return;
    await fetch('/api/plugins/test_plan/plans/' + id, { method: 'DELETE' });
    this.plans = this.plans.filter(p => p.id !== id);
    if (this.activePlan?.id === id) {
      this.activePlan = this.plans[0] || null;
      this.cases = [];
      if (this.activePlan) await this.selectPlan(this.activePlan);
    }
  },
  async updatePlanStatus(status) {
    this.activePlan.status = status;
    await fetch('/api/plugins/test_plan/plans/' + this.activePlan.id, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    const p = this.plans.find(p => p.id === this.activePlan.id);
    if (p) p.status = status;
  },

  async createCase() {
    if (!this.newCase.title.trim()) return;
    const r = await fetch('/api/plugins/test_plan/plans/' + this.activePlan.id + '/cases', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(this.newCase),
    });
    const c = await r.json();
    this.cases.push(c);
    this.newCase = { title: '', steps: '', expected: '', ticket_key: '' };
    this.showNewCase = false;
  },
  async updateCaseResult(c, result) {
    c.result = result;
    await fetch('/api/plugins/test_plan/plans/' + this.activePlan.id + '/cases/' + c.id, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ result }),
    });
  },
  async deleteCase(id) {
    if (!confirm('Delete this test case?')) return;
    await fetch('/api/plugins/test_plan/plans/' + this.activePlan.id + '/cases/' + id, { method: 'DELETE' });
    this.cases = this.cases.filter(c => c.id !== id);
  },

  resultBg(r) {
    return { pass: 'bg-g900 border-g400/40 text-g400', fail: 'bg-r900 border-r400/40 text-r400',
             blocked: 'bg-y900 border-y400/40 text-y400', pending: 'bg-n800 border-n700 text-n500' }[r] || 'bg-n800 border-n700 text-n500';
  },
  planStatusColor(s) {
    return { draft: 'text-n500', active: 'text-acc', closed: 'text-g400' }[s] || 'text-n500';
  },
}" x-init="init()" class="flex-1 flex overflow-hidden text-sm">

  <!-- ── Left: plans list ─────────────────────────────────────────── -->
  <div class="w-60 flex-shrink-0 border-r border-n750 flex flex-col overflow-hidden" style="background:var(--n950)">

    <div class="px-3 py-2.5 border-b border-n750 flex items-center justify-between flex-shrink-0">
      <span class="text-[10px] font-semibold text-n500 uppercase tracking-widest">Test Plans</span>
      <button @click="showNewPlan=!showNewPlan"
              :class="showNewPlan ? 'text-acc bg-accL' : 'text-n500 hover:text-acc hover:bg-accL'"
              class="w-5 h-5 rounded flex items-center justify-center transition-colors text-base font-light leading-none">+</button>
    </div>

    <!-- New plan form -->
    <div x-show="showNewPlan" x-cloak class="p-3 border-b border-n750 space-y-2 flex-shrink-0" style="background:var(--n900)">
      <input x-model="newPlan.name" placeholder="Plan name *"
             @keydown.enter="createPlan()" @keydown.escape="showNewPlan=false"
             class="w-full bg-n800 border border-n700 text-n200 text-xs rounded px-2 py-1.5 focus:outline-none focus:border-acc"/>
      <input x-model="newPlan.sprint" placeholder="Sprint (optional)"
             class="w-full bg-n800 border border-n700 text-n200 text-xs rounded px-2 py-1.5 focus:outline-none focus:border-acc"/>
      <select x-model="newPlan.status"
              class="w-full bg-n800 border border-n700 text-n200 text-xs rounded px-2 py-1.5 focus:outline-none">
        <option value="draft">Draft</option>
        <option value="active">Active</option>
      </select>
      <div class="flex gap-2">
        <button @click="createPlan()" :disabled="!newPlan.name.trim()"
                class="flex-1 bg-acc text-white text-xs rounded px-2 py-1.5 font-medium hover:bg-accH transition-colors disabled:opacity-40">
          Create
        </button>
        <button @click="showNewPlan=false"
                class="flex-1 bg-n800 text-n400 text-xs rounded px-2 py-1.5 hover:text-n200 transition-colors">
          Cancel
        </button>
      </div>
    </div>

    <!-- Plans list -->
    <div class="flex-1 overflow-y-auto py-1">
      <template x-if="loading">
        <div class="py-8 text-center text-xs text-n600">Loading…</div>
      </template>
      <template x-if="!loading && plans.length === 0">
        <div class="px-4 py-8 text-center text-xs text-n600 leading-relaxed">
          No test plans yet.<br>Click <strong class="text-n400">+</strong> to create one.
        </div>
      </template>
      <template x-for="plan in plans" :key="plan.id">
        <button @click="selectPlan(plan)"
                :class="activePlan?.id === plan.id
                  ? 'border-l-2 border-acc bg-accL text-n100'
                  : 'border-l-2 border-transparent text-n300 hover:bg-n800'"
                class="w-full text-left px-3 py-2.5 transition-colors">
          <div class="text-xs font-medium truncate" x-text="plan.name"></div>
          <div class="flex items-center gap-2 mt-0.5">
            <span class="text-[10px] capitalize" :class="planStatusColor(plan.status)" x-text="plan.status"></span>
            <span x-show="plan.sprint" class="text-[10px] text-n600 truncate" x-text="'· ' + plan.sprint"></span>
          </div>
        </button>
      </template>
    </div>
  </div>

  <!-- ── Right: plan detail + cases ───────────────────────────────── -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- Empty state -->
    <template x-if="!activePlan && !loading">
      <div class="flex-1 flex items-center justify-center text-n600 text-xs">
        Select a plan on the left, or create a new one.
      </div>
    </template>

    <template x-if="activePlan">
      <div class="flex-1 flex flex-col overflow-hidden">

        <!-- Plan header -->
        <div class="px-5 py-3 border-b border-n750 flex items-center justify-between flex-shrink-0" style="background:var(--n900)">
          <div>
            <h2 class="text-sm font-semibold text-n100" x-text="activePlan.name"></h2>
            <div class="flex items-center gap-3 mt-0.5">
              <span x-show="activePlan.sprint" class="text-[11px] text-n500" x-text="'Sprint: ' + activePlan.sprint"></span>
              <select x-model="activePlan.status" @change="updatePlanStatus(activePlan.status)"
                      class="text-[11px] bg-transparent border-none focus:outline-none cursor-pointer font-medium"
                      :class="planStatusColor(activePlan.status)">
                <option value="draft">Draft</option>
                <option value="active">Active</option>
                <option value="closed">Closed</option>
              </select>
            </div>
          </div>

          <!-- Stats -->
          <div class="flex items-center gap-5">
            <div class="flex items-center gap-2 text-[11px]">
              <span class="text-g400 tabular-nums font-mono" x-text="stats.pass + ' pass'"></span>
              <span class="text-n700">·</span>
              <span class="text-r400 tabular-nums font-mono" x-text="stats.fail + ' fail'"></span>
              <span class="text-n700">·</span>
              <span class="text-y400 tabular-nums font-mono" x-text="stats.blocked + ' blocked'"></span>
              <span class="text-n700">·</span>
              <span class="text-n500 tabular-nums font-mono" x-text="stats.pending + ' pending'"></span>
            </div>
            <!-- Progress bar -->
            <div class="flex items-center gap-2">
              <div class="w-24 h-1.5 bg-n750 rounded-full overflow-hidden">
                <div class="h-full bg-g400 rounded-full transition-all duration-300" :style="'width:' + stats.pct + '%'"></div>
              </div>
              <span class="text-[11px] text-n400 font-mono tabular-nums" x-text="stats.pct + '%'"></span>
            </div>
            <button @click="deletePlan(activePlan.id)"
                    class="text-[11px] text-n600 hover:text-r400 transition-colors px-2 py-1 rounded hover:bg-n800">
              Delete plan
            </button>
          </div>
        </div>

        <!-- Filter bar + add case -->
        <div class="px-5 py-2 border-b border-n750 flex items-center justify-between flex-shrink-0">
          <div class="flex items-center gap-1 bg-n800 border border-n700 rounded-lg p-0.5">
            <template x-for="f in ['all','pending','pass','fail','blocked']" :key="f">
              <button @click="caseFilter = f"
                      :class="caseFilter === f ? 'bg-n700 text-n100 shadow-sm' : 'text-n500 hover:text-n300'"
                      class="px-2.5 py-0.5 rounded-md text-xs font-medium transition-all capitalize"
                      x-text="f + (f === 'all' ? ' (' + cases.length + ')' : '')"></button>
            </template>
          </div>
          <button @click="showNewCase = !showNewCase"
                  :class="showNewCase ? 'text-accH' : 'text-acc hover:text-accH'"
                  class="flex items-center gap-1 text-xs font-medium transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Add test case
          </button>
        </div>

        <!-- New case form -->
        <div x-show="showNewCase" x-cloak
             class="px-5 py-3 border-b border-n750 flex-shrink-0" style="background:var(--n950)">
          <div class="grid grid-cols-2 gap-3">
            <div class="col-span-2">
              <label class="text-[10px] text-n500 uppercase tracking-wide block mb-1">Title *</label>
              <input x-model="newCase.title" placeholder="What should this test verify?"
                     @keydown.escape="showNewCase=false"
                     class="w-full bg-n800 border border-n700 text-n200 text-xs rounded px-2 py-1.5 focus:outline-none focus:border-acc"/>
            </div>
            <div>
              <label class="text-[10px] text-n500 uppercase tracking-wide block mb-1">Steps</label>
              <textarea x-model="newCase.steps" rows="3" placeholder="1. Navigate to…&#10;2. Click…"
                        class="w-full bg-n800 border border-n700 text-n200 text-xs rounded px-2 py-1.5 focus:outline-none focus:border-acc resize-none"></textarea>
            </div>
            <div>
              <label class="text-[10px] text-n500 uppercase tracking-wide block mb-1">Expected result</label>
              <textarea x-model="newCase.expected" rows="3" placeholder="Should display…"
                        class="w-full bg-n800 border border-n700 text-n200 text-xs rounded px-2 py-1.5 focus:outline-none focus:border-acc resize-none"></textarea>
            </div>
            <div>
              <label class="text-[10px] text-n500 uppercase tracking-wide block mb-1">Linked ticket</label>
              <input x-model="newCase.ticket_key" placeholder="SBE-123 (optional)"
                     class="w-full bg-n800 border border-n700 text-n200 text-xs rounded px-2 py-1.5 focus:outline-none focus:border-acc font-mono"/>
            </div>
            <div class="flex items-end gap-2">
              <button @click="createCase()" :disabled="!newCase.title.trim()"
                      class="flex-1 bg-acc text-white text-xs rounded px-3 py-1.5 font-medium hover:bg-accH transition-colors disabled:opacity-40">
                Add case
              </button>
              <button @click="showNewCase=false; newCase={title:'',steps:'',expected:'',ticket_key:''}"
                      class="px-3 py-1.5 text-xs text-n500 hover:text-n300 transition-colors">
                Cancel
              </button>
            </div>
          </div>
        </div>

        <!-- Cases table -->
        <div class="flex-1 overflow-y-auto">

          <!-- Empty state -->
          <template x-if="filteredCases.length === 0">
            <div class="flex items-center justify-center py-16 text-n600 text-xs">
              <div class="text-center leading-relaxed">
                <svg class="w-8 h-8 mx-auto mb-3 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                </svg>
                <span x-text="caseFilter === 'all' ? 'No test cases yet — click \"Add test case\" above.' : 'No ' + caseFilter + ' cases.'"></span>
              </div>
            </div>
          </template>

          <table x-show="filteredCases.length > 0" class="w-full border-collapse">
            <thead class="sticky top-0 z-10" style="background:var(--n900)">
              <tr class="border-b border-n750">
                <th class="text-left px-4 py-2.5 text-[10px] font-semibold text-n500 uppercase tracking-wider w-8">#</th>
                <th class="text-left px-3 py-2.5 text-[10px] font-semibold text-n500 uppercase tracking-wider">Title</th>
                <th class="text-left px-3 py-2.5 text-[10px] font-semibold text-n500 uppercase tracking-wider w-48">Steps</th>
                <th class="text-left px-3 py-2.5 text-[10px] font-semibold text-n500 uppercase tracking-wider w-48">Expected</th>
                <th class="text-left px-3 py-2.5 text-[10px] font-semibold text-n500 uppercase tracking-wider w-20">Ticket</th>
                <th class="text-left px-3 py-2.5 text-[10px] font-semibold text-n500 uppercase tracking-wider w-32">Result</th>
                <th class="w-8"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(c, idx) in filteredCases" :key="c.id">
                <tr class="border-b border-n800 hover:bg-n800/40 transition-colors">
                  <td class="px-4 py-3 text-n600 font-mono tabular-nums text-xs" x-text="idx + 1"></td>
                  <td class="px-3 py-3">
                    <span class="text-n200 font-medium text-xs" x-text="c.title"></span>
                    <span x-show="c.notes" class="block text-[10px] text-n500 mt-0.5 truncate" x-text="c.notes"></span>
                  </td>
                  <td class="px-3 py-3">
                    <span class="text-n400 text-[11px] whitespace-pre-wrap line-clamp-3 block" x-text="c.steps || '—'"></span>
                  </td>
                  <td class="px-3 py-3">
                    <span class="text-n400 text-[11px] whitespace-pre-wrap line-clamp-3 block" x-text="c.expected || '—'"></span>
                  </td>
                  <td class="px-3 py-3">
                    <span x-show="c.ticket_key" class="font-mono text-[11px] text-acc" x-text="c.ticket_key"></span>
                    <span x-show="!c.ticket_key" class="text-n700 text-xs">—</span>
                  </td>
                  <td class="px-3 py-3">
                    <select :value="c.result" @change="updateCaseResult(c, $event.target.value)"
                            class="text-xs font-medium rounded-md px-2 py-1 border cursor-pointer focus:outline-none transition-colors"
                            :class="resultBg(c.result)">
                      <option value="pending">Pending</option>
                      <option value="pass">Pass ✓</option>
                      <option value="fail">Fail ✗</option>
                      <option value="blocked">Blocked ⚠</option>
                    </select>
                  </td>
                  <td class="px-2 py-3">
                    <button @click="deleteCase(c.id)"
                            class="text-n700 hover:text-r400 transition-colors p-1 rounded hover:bg-n800">
                      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                      </svg>
                    </button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

      </div>
    </template>
  </div>
</div>
